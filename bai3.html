
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký CLB</title>
    <style>
        body {
            font-family: Arial;
        }
        form {
            width: 400px;
            padding: 15px;
            border: 1px solid #ccc;
        }
        .required-field {
            border: 1px solid red;
        }
        label {
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <p>
        <strong>Câu lạc bộ học sinh</strong> giúp bạn phát triển kỹ năng
        <em>Tham gia ngay</em> để khám phá bản thân và 
        <span style="color: blue;">kết nối bạn bè</span>.
    </p>
    <form id="club-form">

        <h3>Thông tin cá nhân</h3>

        <label>Họ và tên:</label>
        <input type="text" class="required-field">

        <label>Email:</label>
        <input type="email" class="required-field">

        <label>Số điện thoại:</label>
        <input type="text" class="required-field">

        <label>Giới tính:</label>
        <input type="radio" name="gender"> Nam
        <input type="radio" name="gender"> Nữ

        <label>Chọn câu lạc bộ:</label>
        <select>
            <option>CLB Lập trình</option>
            <option>CLB Tiếng Anh</option>
            <option>CLB Truyền thông</option>
            <option>CLB Âm nhạc</option>
        </select>

        <label>Sở thích:</label>
        <input type="checkbox"> Đọc sách
        <input type="checkbox"> Chơi thể thao
        <input type="checkbox"> Du lịch
        <input type="checkbox"> Công nghệ

        <label>Giới thiệu bản thân:</label>
        <textarea rows="4" cols="30"></textarea>

        <br><br>

        <input type="checkbox" id="agreement">
        Tôi cam kết các thông tin trên là chính xác.

        <br><br>

        <button type="submit">Gửi đăng ký</button>
        <button type="reset">Làm lại</button>
</form>

</body>
</html>
